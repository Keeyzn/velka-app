[package]
name = "licfmt"
version = "0.1.0"
edition = "2021"
description = "Outils communs de Velka : signatures de publication, composants tiers, secrets chiffrés"
license = "GPL-3.0-or-later"
repository = "https://github.com/Keeyzn/velka-app"
publish = false

[dependencies]
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography"] }

# Mac et Linux : chiffrement des secrets avec une clé rangée dans le trousseau (voir src/dpapi.rs).
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
chacha20poly1305 = "0.10"
